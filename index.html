<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Медитации Точки Ноль</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #120A1F; --text: #F8F5E9; --muted: #D1C4E9;
            --gold: #FFD98A; --blue: #7EC8FF; --red: #D14A4A;
            --font-title: 'Italiana', serif; --font-body: 'Inter', sans-serif;
            --r-md: 14px; --r-lg: 20px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: var(--bg); color: var(--text); font-family: var(--font-body); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            min-height: 100vh; padding: 40px 20px; font-weight: 300; 
        }
        h1, h2, h3 { font-family: var(--font-title); font-weight: 400; letter-spacing: 1px; }

        .c-title { text-align: center; margin-bottom: 30px; }
        .c-title h2 { font-size: 2.4rem; margin-bottom: 10px; color: var(--gold); text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        .c-title p { color: var(--muted); font-size: 0.9rem; text-shadow: 0 2px 5px rgba(0,0,0,0.8); }

        #meditations { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 60px 20px; background: transparent; width: 100%; }
        .med-section-wrapper { width: 100%; max-width: 800px; display: flex; flex-direction: column; }
        
        .med-main-trigger { width: 100%; background: linear-gradient(135deg, rgba(126, 200, 255, 0.1), rgba(255, 217, 138, 0.1)); border: 1px solid var(--gold); border-radius: var(--r-lg); padding: 22px 25px; color: var(--gold); font-family: var(--font-title); font-size: 1.4rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.4s; box-shadow: 0 0 20px rgba(255, 217, 138, 0.1); letter-spacing: 1px; }
        .med-main-trigger:hover { background: linear-gradient(135deg, rgba(126, 200, 255, 0.2), rgba(255, 217, 138, 0.2)); box-shadow: 0 0 30px rgba(255, 217, 138, 0.2); }
        .med-main-trigger.open { border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-color: var(--blue); color: var(--blue); }
        .med-main-trigger .icon { font-size: 1.2rem; transition: transform 0.4s; }
        .med-main-trigger.open .icon { transform: rotate(180deg); }

        .med-content-wrapper { max-height: 0; overflow: hidden; transition: max-height 0.4s cubic-bezier(0.25, 1, 0.5, 1); background: rgba(18, 10, 31, 0.4); border: 1px solid transparent; border-top: none; border-radius: 0 0 var(--r-lg) var(--r-lg); }
        .med-content-wrapper.open { border-color: var(--blue); }

        .med-container { width: 100%; display: flex; flex-direction: column; gap: 15px; padding: 20px; }
        .med-item { display: flex; flex-direction: column; width: 100%; }
        
        .med-card { background: rgba(18, 10, 31, 0.85); backdrop-filter: blur(5px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: var(--r-md); padding: 20px; text-align: left; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: space-between; }
        .med-card:hover { background: rgba(18, 10, 31, 0.95); border-color: var(--muted); transform: translateY(-2px); }
        .med-card.active { border-color: var(--gold); background: rgba(255, 217, 138, 0.05); border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
        .med-info h4 { color: var(--gold); font-weight: 400; margin-bottom: 5px; font-size: 1.1rem; font-family: var(--font-title); }
        .med-info p { color: var(--text); font-size: 0.9rem; }
        .med-card .icon { color: var(--gold); font-size: 1.2rem; transition: transform 0.3s; }
        .med-card.active .icon { transform: rotate(180deg); }
        
        .player-wrapper { max-height: 0; overflow: hidden; transition: max-height 0.4s cubic-bezier(0.25, 1, 0.5, 1); background: rgba(0, 0, 0, 0.4); border: 1px solid transparent; border-top: none; border-radius: 0 0 var(--r-md) var(--r-md); }
        .player-wrapper.open { border-color: var(--gold); }
        .player-box { padding: 25px 20px; text-align: center; position: relative; }
        
        .player-controls { display: flex; align-items: center; justify-content: center; gap: 25px; margin-bottom: 20px; }
        
        .skip-btn { background: transparent; border: none; color: var(--muted); font-size: 20px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; font-family: var(--font-body); }
        .skip-btn:hover { color: var(--gold); }
        
        .play-btn { width: 65px; height: 65px; background: var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; color: var(--bg); font-size: 26px; transition: 0.2s; box-shadow: 0 5px 20px rgba(255,217,138,0.4); }
        .play-btn:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(255,217,138,0.6); }
        .play-btn:active { transform: scale(0.95); }
        
        /* Анимация пульсации, когда трек на паузе */
        .play-btn.paused { animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 217, 138, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(255, 217, 138, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 217, 138, 0); }
        }

        .progress-container { width: 100%; height: 8px; background: rgba(255,255,255,0.2); border-radius: 10px; cursor: pointer; position: relative; margin-bottom: 12px; }
        .progress-fill { width: 0%; height: 100%; background: var(--blue); border-radius: 10px; position: absolute; top: 0; left: 0; pointer-events: none; box-shadow: 0 0 10px rgba(126,200,255,0.5); }
        .player-time { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
        .player-error { color: var(--red); font-size: 0.85rem; margin-top: 15px; display: none; }
        .player-error.show { display: block; }

        @media (max-width: 400px) {
            .c-title h2 { font-size: 1.8rem; }
            .med-main-trigger { font-size: 1.1rem; padding: 18px 15px; }
            .play-btn { width: 55px; height: 55px; font-size: 22px; }
        }
    </style>
</head>
<body>

    <section id="meditations">
        <div class="c-title">
            <h2>Медитации Точки Ноль</h2>
            <p>Выбери состояние, в которое хочешь войти.</p>
        </div>
        
        <div class="med-section-wrapper">
            <div class="med-main-trigger" id="med-main-trigger" onclick="toggleMeditations()">
                <span>Погрузиться в медитации</span>
                <span class="icon">🔽</span>
            </div>
            <div class="med-content-wrapper" id="med-content-wrapper">
                <div class="med-container" id="med-container"></div>
            </div>
        </div>
        
        <audio id="audio-player"></audio>
    </section>

    <script>
        // === ТВОИ МЕДИТАЦИИ ===
        const meditations = [
            { id: 0,  num: "Медитация 0",  name: "Я есть", file: "audio/med0-ja-est.mp3" },
            { id: 1,  num: "Медитация 1",  name: "Точка Ноль", file: "audio/med1-tochka-nol.mp3" },
            { id: 2,  num: "Медитация 2",  name: "Присутствие", file: "audio/med2-prisutstvie.mp3" },
            { id: 3,  num: "Медитация 3",  name: "Синхронность", file: "audio/med3-sinhronnost.mp3" },
            { id: 4,  num: "Медитация 4",  name: "Ровность", file: "audio/med4-rovnost.mp3" },
            { id: 5,  num: "Медитация 5",  name: "Свобода", file: "audio/med5-svoboda.mp3" },
            { id: 6,  num: "Медитация 6",  name: "Естественность", file: "audio/med6-estestvennost.mp3" },
            { id: 7,  num: "Медитация 7",  name: "Я живу как поле", file: "audio/med7-ja-chsivu-kak-pole.mp3" },
            { id: 8,  num: "Медитация 8",  name: "Расширение поля", file: "audio/med8-raschirenie.mp3" },
            { id: 9,  num: "Медитация 9",  name: "Внутренняя ось", file: "audio/med9-vnutrennjaja-os.mp3" },
            { id: 10, num: "Медитация 10", name: "Внутренний мир", file: "audio/med10-vnutrenniy-mir.mp3" },
            { id: 11, num: "Медитация 11", name: "Это уже есть", file: "audio/med11-eto-uche-estj.mp3" }
        ];

        let currentPlayingId = null;
        const audio = document.getElementById('audio-player');

        // === ЛОГИКА ===
        function toggleMeditations() {
            const trigger = document.getElementById('med-main-trigger');
            const wrapper = document.getElementById('med-content-wrapper');
            if (wrapper.classList.contains('open')) {
                wrapper.classList.remove('open');
                trigger.classList.remove('open');
                wrapper.style.maxHeight = '0px';
                closeAllPlayers();
                audio.pause();
            } else {
                wrapper.classList.add('open');
                trigger.classList.add('open');
                wrapper.style.maxHeight = wrapper.scrollHeight + 'px';
                setTimeout(() => {
                    if (wrapper.classList.contains('open')) {
                        wrapper.style.maxHeight = 'none';
                    }
                }, 400);
            }
        }

        function renderMeditations() {
            const container = document.getElementById('med-container');
            container.innerHTML = '';
            meditations.forEach(med => {
                const item = document.createElement('div');
                item.className = 'med-item';
                
                const card = document.createElement('div');
                card.className = 'med-card';
                card.id = 'card-' + med.id;
                card.onclick = () => togglePlayer(med.id, med.file);
                card.innerHTML = `
                    <div class="med-info">
                        <h4>${med.num}</h4>
                        <p>${med.name}</p>
                    </div>
                    <span class="icon">🔽</span>
                `;
                
                const wrapper = document.createElement('div');
                wrapper.className = 'player-wrapper';
                wrapper.id = 'wrapper-' + med.id;
                wrapper.innerHTML = `
                    <div class="player-box">
                        <div class="player-controls">
                            <button class="skip-btn" onclick="skipAudio(-15, ${med.id})" title="-15 сек">⏪ 15</button>
                            <button class="play-btn paused" id="play-btn-${med.id}" onclick="togglePlay(${med.id})">▶</button>
                            <button class="skip-btn" onclick="skipAudio(15, ${med.id})" title="+15 сек">15 ⏩</button>
                        </div>
                        <div class="progress-container" id="progress-bar-${med.id}" onclick="seekAudio(event, ${med.id})">
                            <div class="progress-fill" id="progress-fill-${med.id}"></div>
                        </div>
                        <div class="player-time">
                            <span id="time-current-${med.id}">0:00</span>
                            <span id="time-total-${med.id}">0:00</span>
                        </div>
                        <div class="player-error" id="player-error-${med.id}">Аудиофайл не найден. Проверьте папку audio.</div>
                    </div>
                `;
                
                item.appendChild(card);
                item.appendChild(wrapper);
                container.appendChild(item);
            });
        }

        function togglePlayer(id, file) {
            const currentCard = document.getElementById('card-' + id);
            const currentWrapper = document.getElementById('wrapper-' + id);
            const mainWrapper = document.getElementById('med-content-wrapper');
            
            if (currentWrapper.classList.contains('open')) { 
                closeAllPlayers(); 
                audio.pause(); 
                return; 
            }
            
            closeAllPlayers();
            audio.pause();
            audio.removeAttribute('src');
            audio.load();
            
            currentCard.classList.add('active');
            currentWrapper.classList.add('open');
            currentWrapper.style.maxHeight = currentWrapper.scrollHeight + 'px';
            
            setTimeout(() => {
                if (mainWrapper.classList.contains('open')) {
                    mainWrapper.style.maxHeight = 'none';
                }
            }, 400);
            
            audio.src = file;
            audio.load();
            currentPlayingId = id;
            
            const btn = document.getElementById('play-btn-' + id);
            btn.innerText = '▶';
            btn.classList.add('paused');
            
            document.getElementById('progress-fill-' + id).style.width = '0%';
            document.getElementById('time-current-' + id).innerText = '0:00';
            document.getElementById('time-total-' + id).innerText = '0:00';
            document.getElementById('player-error-' + id).classList.remove('show');
        }

        function closeAllPlayers() {
            document.querySelectorAll('.med-card').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.player-wrapper').forEach(w => {
                w.classList.remove('open');
                w.style.maxHeight = '0px';
            });
            document.querySelectorAll('.play-btn').forEach(b => {
                b.innerText = '▶';
                b.classList.add('paused');
            });
            currentPlayingId = null;
        }

        function togglePlay(id) {
            if (currentPlayingId !== id) return;
            const btn = document.getElementById('play-btn-' + id);
            
            if (audio.paused) {
                audio.play().then(() => {
                    btn.innerText = '⏸';
                    btn.classList.remove('paused');
                }).catch(() => { 
                    document.getElementById('player-error-' + id).classList.add('show'); 
                    btn.innerText = '▶';
                    btn.classList.add('paused');
                });
            } else {
                audio.pause();
                btn.innerText = '▶';
                btn.classList.add('paused');
            }
        }

        function skipAudio(seconds, id) {
            if (currentPlayingId !== id || !audio.duration) return;
            audio.currentTime = Math.max(0, Math.min(audio.currentTime + seconds, audio.duration));
        }

        function updateProgress() {
            if (!audio.duration || currentPlayingId === null) return;
            const percent = (audio.currentTime / audio.duration) * 100;
            document.getElementById('progress-fill-' + currentPlayingId).style.width = percent + '%';
            document.getElementById('time-current-' + currentPlayingId).innerText = formatTime(audio.currentTime);
        }

        function updateDuration() {
            if (currentPlayingId === null) return;
            document.getElementById('time-total-' + currentPlayingId).innerText = formatTime(audio.duration);
            document.getElementById('player-error-' + currentPlayingId).classList.remove('show');
        }

        function showError() {
            if (currentPlayingId === null) return;
            document.getElementById('player-error-' + currentPlayingId).classList.add('show');
            const btn = document.getElementById('play-btn-' + currentPlayingId);
            btn.innerText = '▶';
            btn.classList.add('paused');
        }

        function seekAudio(e, id) {
            if (currentPlayingId !== id || !audio.duration) return;
            const bar = document.getElementById('progress-bar-' + id);
            const rect = bar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audio.currentTime = percent * audio.duration;
        }

        function handleEnded() {
            if (currentPlayingId === null) return;
            const btn = document.getElementById('play-btn-' + currentPlayingId);
            btn.innerText = '▶';
            btn.classList.add('paused');
            document.getElementById('progress-fill-' + currentPlayingId).style.width = '0%';
            document.getElementById('time-current-' + currentPlayingId).innerText = '0:00'; // Сброс времени
        }

        function formatTime(seconds) {
            if (!isFinite(seconds) || isNaN(seconds)) return '0:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return m + ':' + (s < 10 ? '0' : '') + s;
        }

        // === УПРАВЛЕНИЕ С КЛАВИАТУРЫ ===
        document.addEventListener('keydown', function(e) {
            // Если фокус в поле ввода (на всякий случай), игнорируем
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            
            if (e.code === 'Space') {
                e.preventDefault(); // Предотвращаем скролл страницы
                if (currentPlayingId !== null) {
                    togglePlay(currentPlayingId);
                }
            }
        });

        // === ИНИЦИАЛИЗАЦИЯ ===
        audio.addEventListener('timeupdate', updateProgress);
        audio.addEventListener('loadedmetadata', updateDuration);
        audio.addEventListener('error', showError);
        audio.addEventListener('ended', handleEnded);

        window.onload = function() {
            renderMeditations();
        };
    </script>
</body>
</html>
